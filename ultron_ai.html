<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>ULTRON // Neural Search Interface</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#07070a;
    --bg-panel:#111318;
    --bg-panel-2:#171a21;
    --border-line:#2a2e38;
    --text-primary:#e9e7e2;
    --text-dim:#8b8f9c;
    --red-core:#ff2b3d;
    --red-deep:#7a0f1a;
    --amber:#ffb020;
    --cyan-ok:#35e0c8;
    --font-display:'Orbitron', 'Segoe UI', sans-serif;
    --font-body:'Inter', system-ui, -apple-system, sans-serif;
    --font-mono:'JetBrains Mono', 'Courier New', monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:
      radial-gradient(ellipse at 50% -10%, rgba(122,15,26,.28), transparent 55%),
      radial-gradient(ellipse at 100% 110%, rgba(53,224,200,.05), transparent 45%),
      var(--bg-void);
    color:var(--text-primary);
    font-family:var(--font-body);
    overflow:hidden;
  }

  .scanlines{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,.014) 0px, rgba(255,255,255,.014) 1px, transparent 1px, transparent 3px);
  }
  .sweep{
    position:fixed; inset:-20% -20%; pointer-events:none; z-index:0; opacity:.35; mix-blend-mode:screen;
    background:linear-gradient(100deg, transparent 40%, rgba(255,43,61,.05) 48%, rgba(255,43,61,.08) 50%, rgba(255,43,61,.05) 52%, transparent 60%);
    animation:sweepMove 14s linear infinite;
  }
  @keyframes sweepMove{ 0%{ transform:translateX(-15%);} 100%{ transform:translateX(15%);} }

  #app{
    position:relative; z-index:1;
    height:100%; max-width:820px; margin:0 auto;
    display:flex; flex-direction:column;
    border-left:1px solid var(--border-line); border-right:1px solid var(--border-line);
    background:linear-gradient(180deg, rgba(17,19,24,.4), rgba(7,7,10,.2));
  }

  /* ---------- Core signature glyph ---------- */
  .core{
    position:relative; width:16px; height:16px; border-radius:50%; flex-shrink:0;
    background:radial-gradient(circle at 35% 32%, #ff8a94, var(--red-core) 42%, var(--red-deep) 100%);
    box-shadow:0 0 9px 2px rgba(255,43,61,.55);
    animation:corePulse 3.2s ease-in-out infinite;
  }
  .core::after{
    content:''; position:absolute; inset:-5px; border-radius:50%;
    border:1px solid rgba(255,43,61,.3); border-top-color:rgba(255,43,61,.75);
    animation:coreRing 3.4s linear infinite;
  }
  .core.thinking{ animation:corePulse .85s ease-in-out infinite; }
  .core.thinking::after{ animation:coreRing 1s linear infinite; border-top-color:var(--amber); }
  .avatar .core{ width:26px; height:26px; }
  @keyframes corePulse{ 0%,100%{ transform:scale(1); opacity:1;} 50%{ transform:scale(1.18); opacity:.82;} }
  @keyframes coreRing{ from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex; align-items:center; gap:12px;
    padding:14px 18px; border-bottom:1px solid var(--border-line);
    background:rgba(11,12,16,.6); backdrop-filter:blur(6px);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand h1{
    font-family:var(--font-display); font-weight:800; font-size:19px; letter-spacing:.14em;
    margin:0; text-shadow:0 0 14px rgba(255,43,61,.4);
  }
  .brand .tagline{
    font-family:var(--font-mono); font-size:9.5px; letter-spacing:.16em; color:var(--text-dim);
    text-transform:uppercase; margin-top:1px;
  }
  .status-cluster{
    margin-left:auto; display:flex; align-items:center; gap:6px;
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; color:var(--text-dim);
  }
  .status-dot{ width:8px; height:8px; border-radius:50%; background:var(--text-dim); flex-shrink:0; }
  .status-dot.online{ background:var(--cyan-ok); box-shadow:0 0 6px var(--cyan-ok); }
  .status-dot.busy{ background:var(--amber); box-shadow:0 0 6px var(--amber); animation:blinkDot 1s infinite; }
  .status-dot.error{ background:var(--red-core); box-shadow:0 0 6px var(--red-core); }
  @keyframes blinkDot{ 50%{ opacity:.3; } }

  .icon-btn{
    background:var(--bg-panel-2); border:1px solid var(--border-line); color:var(--text-dim);
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em;
    padding:7px 10px; border-radius:7px; cursor:pointer; white-space:nowrap;
  }
  .icon-btn:hover{ color:var(--text-primary); border-color:#3a3f4c; }

  /* ---------- Settings panel ---------- */
  .settings-panel{
    max-height:0; overflow:hidden; opacity:0;
    border-bottom:1px solid var(--border-line);
    background:var(--bg-panel);
    transition:max-height .28s ease, opacity .22s ease, padding .28s ease;
  }
  .settings-panel.open{ max-height:420px; opacity:1; padding:16px 18px 18px; }
  .settings-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .field label{
    display:block; font-family:var(--font-mono); font-size:10px; letter-spacing:.1em;
    color:var(--text-dim); text-transform:uppercase; margin-bottom:6px;
  }
  .segmented{ display:flex; border:1px solid var(--border-line); border-radius:8px; overflow:hidden; }
  .segmented button{
    flex:1; padding:9px 8px; background:var(--bg-panel-2); color:var(--text-dim); border:none;
    font-family:var(--font-mono); font-size:11.5px; letter-spacing:.06em; cursor:pointer;
  }
  .segmented button.active{ background:var(--red-deep); color:#fff; }
  .key-row{ display:flex; gap:6px; }
  input[type="password"], input[type="text"]{
    width:100%; background:var(--bg-void); border:1px solid var(--border-line); border-radius:8px;
    color:var(--text-primary); font-family:var(--font-mono); font-size:12.5px; padding:9px 10px;
  }
  input::placeholder{ color:#555a66; }
  .toggle-row{ display:flex; align-items:center; gap:10px; }
  .switch{ position:relative; width:38px; height:20px; flex-shrink:0; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{
    position:absolute; inset:0; background:var(--bg-panel-2); border:1px solid var(--border-line);
    border-radius:20px; cursor:pointer; transition:.2s;
  }
  .slider::before{
    content:''; position:absolute; width:14px; height:14px; left:2px; top:2px;
    background:var(--text-dim); border-radius:50%; transition:.2s;
  }
  .switch input:checked + .slider{ background:rgba(255,43,61,.25); border-color:var(--red-core); }
  .switch input:checked + .slider::before{ background:var(--red-core); transform:translateX(18px); box-shadow:0 0 6px var(--red-core); }
  .settings-note{
    grid-column:1/-1; font-family:var(--font-mono); font-size:10px; color:var(--text-dim);
    line-height:1.5; border-top:1px dashed var(--border-line); padding-top:10px; margin-top:2px;
  }
  .key-status{ grid-column:1/-1; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.04em; min-height:14px; }
  .key-status.ok{ color:var(--cyan-ok); }
  .key-status.err{ color:var(--red-core); }
  .key-status.warn{ color:var(--amber); }

  /* ---------- Chat log ---------- */
  #chatLog{ flex:1; overflow-y:auto; padding:16px 18px 6px; }
  .msg{ display:flex; gap:10px; padding:9px 0; align-items:flex-start; animation:msgIn .25s ease; }
  @keyframes msgIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }
  .msg.user{ justify-content:flex-end; }
  .msg.assistant{ justify-content:flex-start; }
  .msg.system{ justify-content:center; }
  .avatar{ margin-top:2px; }
  .bubble{
    max-width:78%; padding:12px 14px; font-size:14.5px; line-height:1.55;
    color:var(--text-primary); white-space:pre-wrap; word-wrap:break-word;
  }
  .msg.user .bubble{ background:var(--bg-panel-2); border:1px solid var(--border-line); border-radius:14px 14px 3px 14px; }
  .msg.assistant .bubble{
    background:linear-gradient(180deg, rgba(122,15,26,.14), rgba(17,19,24,.55));
    border:1px solid rgba(255,43,61,.22); border-left:2px solid var(--red-core);
    border-radius:3px 14px 14px 14px;
  }
  .msg.system .bubble{
    font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim);
    background:transparent; border:1px dashed var(--border-line); border-radius:8px; max-width:90%;
  }
  .thinking-text{ font-family:var(--font-mono); font-size:11.5px; letter-spacing:.06em; color:var(--amber); }
  .dots span{ animation:blink 1.4s infinite; opacity:.2; }
  .dots span:nth-child(2){ animation-delay:.2s; }
  .dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,80%,100%{ opacity:.2; } 40%{ opacity:1; } }

  .sources{ margin-top:9px; border-top:1px solid rgba(255,255,255,.08); padding-top:8px; font-family:var(--font-mono); font-size:11px; }
  .sources summary{ cursor:pointer; color:var(--amber); letter-spacing:.04em; outline:none; }
  .sources a{
    display:block; color:var(--cyan-ok); text-decoration:none; padding:4px 0 4px 4px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; border-left:1px solid rgba(53,224,200,.25);
    margin-top:2px;
  }
  .sources a:hover{ text-decoration:underline; }

  /* ---------- Composer ---------- */
  .composer{ padding:12px 18px 14px; border-top:1px solid var(--border-line); background:var(--bg-panel); }
  .composer-row{ display:flex; gap:10px; align-items:flex-end; }
  textarea#userInput{
    flex:1; resize:none; background:var(--bg-void); border:1px solid var(--border-line); border-radius:10px;
    color:var(--text-primary); font-family:var(--font-body); font-size:14.5px; padding:11px 12px;
    max-height:140px; min-height:44px; line-height:1.4;
  }
  textarea#userInput:focus{ border-color:rgba(255,43,61,.5); }
  #sendBtn{
    flex-shrink:0; width:44px; height:44px; border-radius:10px; border:1px solid var(--red-deep);
    background:linear-gradient(160deg, rgba(255,43,61,.25), rgba(122,15,26,.35));
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  #sendBtn:hover{ border-color:var(--red-core); }
  #sendBtn:disabled{ opacity:.4; cursor:not-allowed; }
  .send-icon{ width:0; height:0; border-top:6px solid transparent; border-bottom:6px solid transparent; border-left:10px solid var(--text-primary); margin-left:2px; }
  .composer-hint{
    font-family:var(--font-mono); font-size:9.5px; color:#4c505c; letter-spacing:.05em;
    margin-top:7px; text-align:center;
  }

  *:focus-visible{ outline:2px solid var(--red-core); outline-offset:2px; }
  ::-webkit-scrollbar{ width:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--bg-panel-2); border:2px solid var(--bg-void); border-radius:6px; }

  @media (max-width:640px){
    .settings-grid{ grid-template-columns:1fr; }
    .bubble{ max-width:88%; }
    .brand h1{ font-size:16px; }
  }
  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }
</style>
</head>
<body>

<div class="scanlines"></div>
<div class="sweep"></div>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="core" id="brandCore"></div>
      <div>
        <h1>ULTRON</h1>
        <div class="tagline">Neural Search Interface</div>
      </div>
    </div>
    <div class="status-cluster">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">AWAITING KEY</span>
    </div>
    <button class="icon-btn" id="resetBtn" title="Clear conversation">⟲ RESET</button>
    <button class="icon-btn" id="settingsBtn" title="Configuration">⚙ CONFIG</button>
  </header>

  <section class="settings-panel" id="settingsPanel">
    <div class="settings-grid">
      <div class="field" style="grid-column:1/-1;">
        <label>Provider</label>
        <div class="segmented">
          <button type="button" class="provider-btn active" data-provider="claude">CLAUDE</button>
          <button type="button" class="provider-btn" data-provider="gemini">GEMINI</button>
          <button type="button" class="provider-btn" data-provider="openai">OPENAI</button>
        </div>
      </div>

      <div class="field" style="grid-column:1/-1;" id="keyField">
        <label for="apiKeyInput">API Key</label>
        <div class="key-row">
          <input type="password" id="apiKeyInput" placeholder="Paste your API key" autocomplete="off">
          <button class="icon-btn" id="toggleKeyVis" type="button" title="Show/hide key">👁</button>
          <button class="icon-btn" id="verifyBtn" type="button">VERIFY</button>
        </div>
      </div>

      <div class="field" id="modelField">
        <label for="modelInput">Model</label>
        <input type="text" id="modelInput" placeholder="model id">
        <div id="modelHint" style="font-family:var(--font-mono); font-size:9.5px; color:#4c505c; margin-top:5px;"></div>
      </div>

      <div class="field">
        <label>Web Search</label>
        <div class="toggle-row">
          <label class="switch">
            <input type="checkbox" id="searchToggle" checked>
            <span class="slider"></span>
          </label>
          <span id="searchToggleLabel" style="font-family:var(--font-mono); font-size:11px; color:var(--text-dim);">GROUNDING ON</span>
        </div>
      </div>

      <div class="key-status" id="keyStatus"></div>

      <div class="settings-note" id="settingsNote"></div>
    </div>
  </section>

  <main id="chatLog"></main>

  <footer class="composer">
    <div class="composer-row">
      <textarea id="userInput" rows="1" placeholder="Transmit a query to Ultron…"></textarea>
      <button id="sendBtn" title="Send"><span class="send-icon"></span></button>
    </div>
    <div class="composer-hint">ENTER TO EXECUTE · SHIFT+ENTER FOR NEW LINE</div>
  </footer>
</div>

<script>
(function(){
  const DEFAULT_MODELS = { claude:'claude-sonnet-4-6', gemini:'gemini-3.7-flash', openai:'gpt-5.6' };
  const PROVIDER_NOTES = {
    claude: 'Runs through Claude.ai\'s own built-in API access — no key required. This only works while this file is open as an artifact inside Claude.ai. If you download it and open it as a standalone local file, switch to Gemini or OpenAI and supply your own key.',
    gemini: 'Your key is used only for direct calls to Google\'s API from this page, for this session — it is never stored, saved, or sent anywhere else. Reloading the page clears it; you\'ll need to re-enter and re-verify it.',
    openai: 'Your key is used only for direct calls to OpenAI\'s API from this page, for this session — it is never stored, saved, or sent anywhere else. Reloading the page clears it; you\'ll need to re-enter and re-verify it.'
  };
  const MODEL_HINTS = {
    claude: 'Fixed — Claude Sonnet 4.6, set by the platform.',
    gemini: 'e.g. gemini-3.7-flash, gemini-2.5-flash',
    openai: 'e.g. gpt-5.6, gpt-5.6-terra, gpt-5.6-luna'
  };

  const state = {
    provider:'claude',
    keys:{ gemini:'', openai:'' },
    models:{ claude:DEFAULT_MODELS.claude, gemini:DEFAULT_MODELS.gemini, openai:DEFAULT_MODELS.openai },
    searchEnabled:true,
    messages:[],
    busy:false
  };

  const el = {
    chatLog:document.getElementById('chatLog'),
    input:document.getElementById('userInput'),
    sendBtn:document.getElementById('sendBtn'),
    statusDot:document.getElementById('statusDot'),
    statusText:document.getElementById('statusText'),
    settingsPanel:document.getElementById('settingsPanel'),
    settingsBtn:document.getElementById('settingsBtn'),
    resetBtn:document.getElementById('resetBtn'),
    providerBtns:document.querySelectorAll('.provider-btn'),
    apiKeyInput:document.getElementById('apiKeyInput'),
    toggleKeyVis:document.getElementById('toggleKeyVis'),
    verifyBtn:document.getElementById('verifyBtn'),
    modelInput:document.getElementById('modelInput'),
    modelHint:document.getElementById('modelHint'),
    keyField:document.getElementById('keyField'),
    settingsNote:document.getElementById('settingsNote'),
    searchToggle:document.getElementById('searchToggle'),
    searchToggleLabel:document.getElementById('searchToggleLabel'),
    keyStatus:document.getElementById('keyStatus')
  };

  function requiresKey(){ return state.provider === 'gemini' || state.provider === 'openai'; }

  function syncProviderUI(){
    el.keyField.style.display = requiresKey() ? '' : 'none';
    el.modelInput.value = state.models[state.provider];
    el.modelInput.readOnly = state.provider === 'claude';
    el.modelHint.textContent = MODEL_HINTS[state.provider];
    el.settingsNote.textContent = PROVIDER_NOTES[state.provider];
    el.keyStatus.textContent = '';
    el.keyStatus.className = 'key-status';
  }
  syncProviderUI();

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function scrollToBottom(){
    el.chatLog.scrollTop = el.chatLog.scrollHeight;
  }

  function addMessageNode(opts){
    const role = opts.role, text = opts.text, sources = opts.sources, pending = opts.pending;
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;

    if(role === 'assistant'){
      const av = document.createElement('div');
      av.className = 'avatar';
      const core = document.createElement('div');
      core.className = 'core' + (pending ? ' thinking' : '');
      av.appendChild(core);
      wrap.appendChild(av);
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if(pending){
      bubble.innerHTML = '<span class="thinking-text">' +
        (state.searchEnabled ? 'QUERYING NETWORK' : 'ANALYZING') +
        '<span class="dots"><span>.</span><span>.</span><span>.</span></span></span>';
    } else {
      bubble.innerHTML = escapeHtml(text).replace(/\n/g, '<br>');
      if(sources && sources.length){
        const det = document.createElement('details');
        det.className = 'sources';
        const sum = document.createElement('summary');
        sum.textContent = '◈ SOURCES ACCESSED (' + sources.length + ')';
        det.appendChild(sum);
        sources.forEach(function(s){
          const a = document.createElement('a');
          a.href = s.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          let host = '';
          try{ host = new URL(s.url).hostname.replace('www.',''); }catch(e){ host = ''; }
          a.textContent = (s.title ? s.title : (host || s.url)) + (host ? '  — ' + host : '');
          det.appendChild(a);
        });
        bubble.appendChild(det);
      }
    }

    wrap.appendChild(bubble);
    el.chatLog.appendChild(wrap);
    scrollToBottom();
    return wrap;
  }

  function addSystemLine(text){
    const wrap = document.createElement('div');
    wrap.className = 'msg system';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = '> ' + text;
    wrap.appendChild(bubble);
    el.chatLog.appendChild(wrap);
    scrollToBottom();
  }

  function setStatus(mode, text){
    el.statusDot.className = 'status-dot ' + mode;
    el.statusText.textContent = text;
  }

  function currentKey(){ return state.keys[state.provider]; }

  function updateStatus(){
    if(state.provider === 'claude'){
      setStatus('online', 'CLAUDE LINKED — NO KEY NEEDED');
    } else if(!currentKey()){
      setStatus('idle', 'AWAITING KEY');
    } else {
      setStatus('idle', 'KEY SET — NOT VERIFIED');
    }
  }

  el.providerBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      state.provider = btn.dataset.provider;
      el.providerBtns.forEach(function(b){ b.classList.toggle('active', b === btn); });
      el.apiKeyInput.value = state.keys[state.provider] || '';
      syncProviderUI();
      updateStatus();
    });
  });

  el.apiKeyInput.addEventListener('input', function(){
    state.keys[state.provider] = el.apiKeyInput.value.trim();
    updateStatus();
  });

  el.modelInput.addEventListener('input', function(){
    state.models[state.provider] = el.modelInput.value.trim() || DEFAULT_MODELS[state.provider];
  });

  el.searchToggle.addEventListener('change', function(){
    state.searchEnabled = el.searchToggle.checked;
    el.searchToggleLabel.textContent = state.searchEnabled ? 'GROUNDING ON' : 'GROUNDING OFF';
  });

  el.toggleKeyVis.addEventListener('click', function(){
    el.apiKeyInput.type = el.apiKeyInput.type === 'password' ? 'text' : 'password';
  });

  el.settingsBtn.addEventListener('click', function(){
    el.settingsPanel.classList.toggle('open');
  });

  el.resetBtn.addEventListener('click', function(){
    state.messages = [];
    el.chatLog.innerHTML = '';
    addSystemLine('CONVERSATION CLEARED. LINK SETTINGS RETAINED.');
  });

  async function safeErr(res){
    try{
      const j = await res.json();
      if(j.error){ return j.error.message || j.error.status || (res.status + ' ' + res.statusText); }
      return res.status + ' ' + res.statusText;
    }catch(e){
      return res.status + ' ' + res.statusText;
    }
  }

  async function verifyKey(){
    const key = currentKey();
    if(!key){
      el.keyStatus.textContent = 'ENTER A KEY FIRST.';
      el.keyStatus.className = 'key-status warn';
      return;
    }
    el.keyStatus.textContent = 'VERIFYING…';
    el.keyStatus.className = 'key-status';
    try{
      let res;
      if(state.provider === 'gemini'){
        res = await fetch('https://generativelanguage.googleapis.com/v1beta/models', {
          headers:{ 'x-goog-api-key': key }
        });
      } else {
        res = await fetch('https://api.openai.com/v1/models', {
          headers:{ 'Authorization': 'Bearer ' + key }
        });
      }
      if(!res.ok){ throw new Error(await safeErr(res)); }
      el.keyStatus.textContent = 'KEY VERIFIED ✓';
      el.keyStatus.className = 'key-status ok';
      setStatus('online', state.provider.toUpperCase() + ' LINKED');
    }catch(err){
      el.keyStatus.textContent = 'FAILED: ' + err.message;
      el.keyStatus.className = 'key-status err';
      setStatus('error', 'LINK FAILED');
    }
  }
  el.verifyBtn.addEventListener('click', verifyKey);

  el.input.addEventListener('input', function(){
    el.input.style.height = 'auto';
    el.input.style.height = Math.min(el.input.scrollHeight, 140) + 'px';
  });
  el.input.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      handleSend();
    }
  });
  el.sendBtn.addEventListener('click', handleSend);

  async function handleSend(){
    const text = el.input.value.trim();
    if(!text || state.busy) return;
    if(requiresKey() && !currentKey()){
      addSystemLine('NO API KEY SET FOR ' + state.provider.toUpperCase() + '. OPEN CONFIG AND ENTER ONE.');
      el.settingsPanel.classList.add('open');
      return;
    }

    state.messages.push({ role:'user', text:text });
    addMessageNode({ role:'user', text:text });
    el.input.value = '';
    el.input.style.height = 'auto';

    state.busy = true;
    el.sendBtn.disabled = true;
    setStatus('busy', state.searchEnabled ? 'SEARCHING…' : 'THINKING…');
    const pendingNode = addMessageNode({ role:'assistant', pending:true });

    try{
      const result = state.provider === 'gemini' ? await callGemini()
        : state.provider === 'openai' ? await callOpenAI()
        : await callClaude();
      pendingNode.remove();
      state.messages.push({ role:'assistant', text:result.text });
      addMessageNode({ role:'assistant', text:result.text, sources:result.sources });
      setStatus('online', state.provider.toUpperCase() + ' LINKED');
    }catch(err){
      pendingNode.remove();
      addSystemLine('ERROR: ' + err.message);
      setStatus('error', 'REQUEST FAILED');
    }finally{
      state.busy = false;
      el.sendBtn.disabled = false;
    }
  }

  async function callClaude(){
    const messages = state.messages.map(function(m){ return { role:m.role, content:m.text }; });
    const body = { model:'claude-sonnet-4-6', max_tokens:1000, messages:messages };
    if(state.searchEnabled){ body.tools = [{ type:'web_search_20250305', name:'web_search' }]; }

    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body:JSON.stringify(body)
    });
    if(!res.ok){ throw new Error(await safeErr(res)); }
    const data = await res.json();

    let text = '';
    const sources = [];
    const seen = {};
    (data.content || []).forEach(function(block){
      if(block.type === 'text'){
        text += block.text || '';
        if(Array.isArray(block.citations)){
          block.citations.forEach(function(c){
            if(c.url && !seen[c.url]){ seen[c.url] = true; sources.push({ title:c.title || '', url:c.url }); }
          });
        }
      } else if(block.type === 'web_search_tool_result' && Array.isArray(block.content)){
        block.content.forEach(function(r){
          if(r.url && !seen[r.url]){ seen[r.url] = true; sources.push({ title:r.title || '', url:r.url }); }
        });
      }
    });
    if(!text){ text = '(no response)'; }
    return { text:text, sources:sources };
  }

  async function callGemini(){
    const key = state.keys.gemini;
    const model = state.models.gemini || DEFAULT_MODELS.gemini;
    const contents = state.messages.map(function(m){
      return { role: m.role === 'assistant' ? 'model' : 'user', parts:[{ text:m.text }] };
    });
    const body = { contents:contents };
    if(state.searchEnabled){ body.tools = [{ google_search:{} }]; }

    const res = await fetch(
      'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent',
      {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'x-goog-api-key':key },
        body:JSON.stringify(body)
      }
    );
    if(!res.ok){ throw new Error(await safeErr(res)); }
    const data = await res.json();
    const cand = data.candidates && data.candidates[0];
    const text = (cand && cand.content && cand.content.parts)
      ? cand.content.parts.map(function(p){ return p.text || ''; }).join('')
      : '(no response)';

    const sources = [];
    const seen = {};
    const chunks = cand && cand.groundingMetadata && cand.groundingMetadata.groundingChunks;
    if(chunks){
      chunks.forEach(function(c){
        const w = c.web;
        if(w && w.uri && !seen[w.uri]){
          seen[w.uri] = true;
          sources.push({ title:w.title || '', url:w.uri });
        }
      });
    }
    return { text:text, sources:sources };
  }

  async function callOpenAI(){
    const key = state.keys.openai;
    const model = state.models.openai || DEFAULT_MODELS.openai;
    const input = state.messages.map(function(m){ return { role:m.role, content:m.text }; });
    const body = { model:model, input:input };
    if(state.searchEnabled){ body.tools = [{ type:'web_search' }]; }

    let res;
    try{
      res = await fetch('https://api.openai.com/v1/responses', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + key },
        body:JSON.stringify(body)
      });
    }catch(networkErr){
      throw new Error('Network/CORS error calling OpenAI directly from the browser. Gemini generally allows direct browser calls — OpenAI may need a small server-side proxy if this keeps happening.');
    }
    if(!res.ok){ throw new Error(await safeErr(res)); }
    const data = await res.json();

    let text = data.output_text || '';
    const sources = [];
    const seen = {};
    if(Array.isArray(data.output)){
      data.output.forEach(function(item){
        if(item.type === 'message' && Array.isArray(item.content)){
          item.content.forEach(function(part){
            if(!text && part.type === 'output_text'){ text = part.text || ''; }
            if(Array.isArray(part.annotations)){
              part.annotations.forEach(function(ann){
                if(ann.type === 'url_citation' && ann.url && !seen[ann.url]){
                  seen[ann.url] = true;
                  sources.push({ title:ann.title || '', url:ann.url });
                }
              });
            }
          });
        }
      });
    }
    if(!text){ text = '(no response)'; }
    return { text:text, sources:sources };
  }

  addSystemLine('ULTRON ONLINE. RUNNING ON CLAUDE — NO KEY NEEDED. TYPE BELOW TO BEGIN.');
  addSystemLine('WANT GEMINI OR OPENAI INSTEAD? OPEN CONFIG AND SWITCH PROVIDER.');
  updateStatus();
})();
</script>
</body>
